---
- name: Deploy mtg with users API
  hosts: mtg
  gather_facts: true
  vars:
    mtg_domain: "{{ lookup('env', 'MTG_DOMAIN') }}"
    mtg_public_ip: "{{ lookup('env', 'MTG_PUBLIC_IP') }}"
    mtg_proxy_port: "{{ lookup('env', 'MTG_PROXY_PORT') | int }}"
    mtg_api_bind: "{{ lookup('env', 'MTG_API_BIND') }}"
    mtg_api_public_port: "{{ lookup('env', 'MTG_API_PUBLIC_PORT') | int }}"
    mtg_api_auth_header: "{{ lookup('env', 'MTG_API_AUTH_HEADER') }}"
    mtg_secret: "{{ lookup('env', 'MTG_SECRET') }}"
    mtg_default_host: "{{ lookup('env', 'MTG_DEFAULT_HOST') | default(lookup('env', 'MTG_DOMAIN'), true) }}"
    mtg_selfsteal_enabled: "{{ lookup('env', 'MTG_SELFSTEAL_ENABLED', default='false') | bool }}"
    mtg_selfsteal_port: "{{ lookup('env', 'MTG_SELFSTEAL_PORT') | default('8446', true) | int }}"
    mtg_install_dir: /opt/mtg
    mtg_local_binary: "{{ playbook_dir }}/../mtg-linux-amd64"

  tasks:
    - name: Require deploy .env variables
      ansible.builtin.assert:
        that:
          - mtg_domain | length > 0
          - mtg_secret | length > 0
          - mtg_api_auth_header | length > 0
          - mtg_default_host | length > 0
        fail_msg: "Fill deploy/.env (see deploy/.env.example). Set MTG_DEFAULT_HOST to MTG_DOMAIN unless you know why not."

    - name: Allow mtg API and MTProto ports in UFW
      ansible.builtin.command: "ufw allow {{ item.port }}/tcp comment {{ item.comment }}"
      register: ufw_rule
      changed_when: "'Rule added' in ufw_rule.stdout"
      failed_when: ufw_rule.rc != 0 and 'Skipping' not in ufw_rule.stderr
      loop:
        - { port: "{{ mtg_api_public_port }}", comment: mtg-api }
        - { port: "{{ mtg_proxy_port }}", comment: mtg-mtproto }

    - name: Allow mtg self-steal port in UFW
      ansible.builtin.command: "ufw allow {{ mtg_selfsteal_port }}/tcp comment mtg-selfsteal"
      register: ufw_selfsteal
      changed_when: "'Rule added' in ufw_selfsteal.stdout"
      failed_when: ufw_selfsteal.rc != 0 and 'Skipping' not in ufw_selfsteal.stderr
      when: mtg_selfsteal_enabled

    - name: Install packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true

    - name: Create install directory
      ansible.builtin.file:
        path: "{{ mtg_install_dir }}"
        state: directory
        mode: "0755"

    - name: Install mtg binary
      ansible.builtin.copy:
        src: "{{ mtg_local_binary }}"
        dest: "{{ mtg_install_dir }}/mtg"
        mode: "0755"

    - name: Render mtg config
      ansible.builtin.template:
        src: config.toml.j2
        dest: "{{ mtg_install_dir }}/config.toml"
        mode: "0644"
      notify: Restart mtg

    - name: Check existing users.toml
      ansible.builtin.stat:
        path: "{{ mtg_install_dir }}/users.toml"
      register: mtg_users_file

    - name: Seed users.toml on first deploy only
      ansible.builtin.template:
        src: users.toml.j2
        dest: "{{ mtg_install_dir }}/users.toml"
        mode: "0600"
      when: not mtg_users_file.stat.exists
      notify: Restart mtg

    - name: Backup users.toml before any manual template run
      ansible.builtin.copy:
        src: "{{ mtg_install_dir }}/users.toml"
        dest: "{{ mtg_install_dir }}/users.toml.bak"
        remote_src: true
        mode: "0600"
      when: mtg_users_file.stat.exists
      changed_when: false

    - name: Install systemd unit
      ansible.builtin.template:
        src: mtg.service.j2
        dest: /etc/systemd/system/mtg.service
        mode: "0644"
      notify:
        - Daemon reload
        - Restart mtg

    - name: Enable and start mtg
      ansible.builtin.systemd:
        name: mtg
        enabled: true
        state: started
        daemon_reload: true

    - name: Deploy nginx site (HTTP for ACME)
      ansible.builtin.template:
        src: nginx-mtg-api.conf.j2
        dest: "/etc/nginx/sites-available/mtg-api-{{ mtg_domain }}"
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/mtg-api-{{ mtg_domain }}"
        dest: "/etc/nginx/sites-enabled/mtg-api-{{ mtg_domain }}"
        state: link
      notify: Reload nginx

    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx before cert
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Obtain TLS certificate
      ansible.builtin.command: >-
        certbot certonly --nginx
        -d {{ mtg_domain }}
        --non-interactive --agree-tos
        -m admin@zxcv.best
      args:
        creates: "/etc/letsencrypt/live/{{ mtg_domain }}/fullchain.pem"
      register: certbot_result
      failed_when: >-
        certbot_result.rc != 0
        and 'Certificate not yet due for renewal' not in (certbot_result.stdout | default(''))
        and 'Certificate not yet due for renewal' not in (certbot_result.stderr | default(''))

    - name: Deploy nginx site (HTTPS + API proxy)
      ansible.builtin.template:
        src: nginx-mtg-api-ssl.conf.j2
        dest: "/etc/nginx/sites-available/mtg-api-{{ mtg_domain }}"
        mode: "0644"
      notify: Reload nginx

    - name: Deploy nginx self-steal site (local facade, optional)
      ansible.builtin.template:
        src: nginx-mtg-selfsteal.conf.j2
        dest: "/etc/nginx/sites-available/mtg-selfsteal-{{ mtg_domain }}"
        mode: "0644"
      when: mtg_selfsteal_enabled
      notify: Reload nginx

    - name: Enable nginx self-steal site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/mtg-selfsteal-{{ mtg_domain }}"
        dest: "/etc/nginx/sites-enabled/mtg-selfsteal-{{ mtg_domain }}"
        state: link
      when: mtg_selfsteal_enabled
      notify: Reload nginx

    - name: Disable local nginx self-steal site
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/mtg-selfsteal-{{ mtg_domain }}"
        state: absent
      when: not mtg_selfsteal_enabled
      notify: Reload nginx

    - name: Update default-host in users.toml
      ansible.builtin.replace:
        path: "{{ mtg_install_dir }}/users.toml"
        regexp: "^default-host = ['\"].*['\"]"
        replace: "default-host = '{{ mtg_default_host }}'"
      when: mtg_users_file.stat.exists
      notify: Restart mtg

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify mtg service is active
      ansible.builtin.systemd:
        name: mtg
      register: mtg_unit
      failed_when: mtg_unit.status.ActiveState != 'active'

    - name: Verify control API health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mtg_api_bind.split(':')[-1] }}/v1/health"
        headers:
          Authorization: "{{ mtg_api_auth_header }}"
        status_code: 200
      register: mtg_health
      failed_when: mtg_health.json.ok != true

    - name: Verify mtg doctor (connectivity)
      ansible.builtin.command: "{{ mtg_install_dir }}/mtg doctor {{ mtg_install_dir }}/config.toml"
      register: mtg_doctor
      changed_when: false
      failed_when: mtg_doctor.rc != 0

  handlers:
    - name: Daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart mtg
      ansible.builtin.systemd:
        name: mtg
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
